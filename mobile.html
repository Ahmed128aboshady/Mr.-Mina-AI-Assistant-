<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>مستر مينا - نسخة الموبايل الذكية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Isolated Mobile Styles -->
  <link rel="stylesheet" href="css/mobile.css?v=15.0" />
  <link rel="stylesheet" href="css/mobile_editor.css?v=15.0" />
  
  <!-- Three.js for 3D Lab -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 🖥️ Top Banner on Desktop Screens to return to Desktop version -->
  <a href="index.html?desktop=1" onclick="sessionStorage.setItem('mena_force_desktop', '1')" class="desktop-switch-banner" title="العودة لنسخة الديسكتوب الأصلية">
    🖥️ <span>العودة لنسخة الديسكتوب الكاملة</span>
  </a>

  <!-- ══════════════════════════════════════════
       📱 MAIN MOBILE CONTAINER (مطابق للصورة 100%)
  ═══════════════════════════════════════════ -->
  <div class="mobile-app-container">

    <!-- ── 1. TOP RIGHT: LOGO + 1 2 3 BADGES ── -->
    <header class="mobile-header-top-right">
      <img src="assets/mobile/logo.png" alt="الكيميائي في العلوم - أ. مينا جرجس" class="mobile-logo-img" />
      <div class="mobile-grades-row">
        <button class="mobile-grade-btn active" id="mobile-grade-btn-1" onclick="MobileApp.selectGrade(1)" title="الصف الأول الإعدادي">
          <img src="assets/mobile/badge_1.png" alt="1" />
        </button>
        <button class="mobile-grade-btn" id="mobile-grade-btn-2" onclick="MobileApp.selectGrade(2)" title="الصف الثاني الإعدادي">
          <img src="assets/mobile/badge_2.png" alt="2" />
        </button>
        <button class="mobile-grade-btn" id="mobile-grade-btn-3" onclick="MobileApp.selectGrade(3)" title="الصف الثالث الإعدادي">
          <img src="assets/mobile/badge_3.png" alt="3" />
        </button>
      </div>
    </header>

    <!-- ── 2. LEFT COLUMN: 4 STACKED STAGE CARDS ── -->
    <main class="mobile-left-cards-column">
      <div class="mobile-stage-card" onclick="MobileApp.openStage(1)" title="المرحلة الأولى">
        <img src="assets/mobile/card_1.png" alt="المرحلة الأولى" />
      </div>
      <div class="mobile-stage-card" onclick="MobileApp.openStage(2)" title="المرحلة الثانية">
        <img src="assets/mobile/card_2.png" alt="المرحلة الثانية" />
      </div>
      <div class="mobile-stage-card" onclick="MobileApp.openStage(3)" title="المرحلة الثالثة">
        <img src="assets/mobile/card_3.png" alt="المرحلة الثالثة" />
      </div>
      <div class="mobile-stage-card" onclick="MobileApp.openStage(4)" title="المرحلة الرابعة">
        <img src="assets/mobile/card_4.png" alt="المرحلة الرابعة" />
      </div>
    </main>

    <!-- ── 3. MR MINA 3D AVATAR (RIGHT EXTENDING DOWN) ── -->
    <div class="mobile-avatar-stage">
      <img src="assets/mobile/mr_mena.png" alt="مستر مينا جرجس" class="mobile-avatar-img" />
    </div>

    <!-- ── 4. BOTTOM FLOATING CHAT BAR ── -->
    <footer class="mobile-bottom-chat-bar">
      <input
        type="text"
        id="mobile-chat-input"
        class="mobile-chat-input"
        placeholder="Ask me a question.."
        onkeydown="if(event.key==='Enter') MobileApp.sendChat()"
      />
      <div class="mobile-chat-actions">
        <button class="mobile-action-btn btn-mic" onclick="MobileApp.toggleMic()" title="تسجيل صوتي">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
        <button class="mobile-action-btn btn-send" onclick="MobileApp.sendChat()" title="إرسال">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>

  </div><!-- /mobile-app-container -->

  <!-- ══════════════════════════════════════════
       📖 5. MOBILE LESSON DRAWER (BOTTOM SHEET)
  ═══════════════════════════════════════════ -->
  <div class="mobile-drawer-overlay" id="mobile-drawer-overlay" onclick="MobileApp.closeDrawer()">
    <div class="mobile-bottom-drawer" onclick="event.stopPropagation()">
      <div class="drawer-drag-pill"></div>
      <div class="mobile-drawer-header">
        <div class="mobile-drawer-title" id="mobile-drawer-title">الوحدة الأولى: المادة</div>
        <button class="mobile-drawer-close" onclick="MobileApp.closeDrawer()">✕</button>
      </div>
      <div id="mobile-drawer-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       🧪 6. MOBILE IN-LESSON 3D LAB SCREEN
  ═══════════════════════════════════════════ -->
  <div class="mobile-lesson-screen" id="mobile-lesson-screen">
    <div class="mobile-lesson-header">
      <button class="mobile-back-btn" onclick="MobileApp.closeLessonScreen()">← رجوع</button>
      <div class="mobile-lesson-header-title" id="mobile-lesson-header-title">الدرس الأول: تركيب الذرة</div>
    </div>
    <div class="mobile-lab-wrap">
      <canvas id="mobile-lab-canvas"></canvas>
      <div class="mobile-lab-controls" id="mobile-lab-controls">
        <div class="mobile-pill-bar" id="mobile-pill-bar">
          <!-- Control Buttons -->
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       💬 7. MOBILE LIVE CHAT WINDOW OVERLAY
  ═══════════════════════════════════════════ -->
  <div class="mobile-chat-overlay" id="mobile-chat-overlay">
    <div class="mobile-chat-window">
      <div class="mobile-chat-window-header">
        <div class="mobile-chat-window-title">🤖 مساعد مستر مينا الذكي</div>
        <button class="mobile-drawer-close" onclick="MobileApp.closeChatOverlay()">✕</button>
      </div>
      <div class="mobile-chat-messages" id="mobile-chat-messages">
        <div class="mobile-msg-bot">
          أهلاً بيك يا بطل! اسألني أي سؤال في منهج العلوم وهشرحهولك خطوة بخطوة بالعامية المصرية! 🚀
        </div>
      </div>
    </div>
  </div>

  <!-- Curriculum Database & Mobile Engine -->
  <script src="js/curriculum_data.js"></script>
  <script src="js/mobile.js?v=12.0"></script>
  <script src="js/mobile_editor.js?v=5.0"></script>
</body>
</html>
