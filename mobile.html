<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الخيميائي • تجربة الموبايل والتابلت</title>
  <link rel="stylesheet" href="css/mobile-v2.css?v=1">
  <link rel="stylesheet" href="css/mobile-integration.css?v=qa2">
  <link rel="stylesheet" href="css/specialized-labs.css?v=dedicated1">
</head>
<body class="mina-mobile">
<div class="m-app">
  <header class="m-header">
    <div class="m-brand"><img src="assets/logo.png" alt="الخيميائي في العلوم"><span>مع مستر مينا<span class="m-muted m-small" id="current-grade-label">الصف الأول الإعدادي</span></span></div>
    <span class="m-score" aria-label="نجوم هذه التجربة">★ <b id="stars">0</b></span>
  </header>
  <div class="m-layout">
    <aside class="m-sidebar" aria-label="الدروس"><h2>رحلتك في العلوم</h2><div id="sidebar-lessons"></div><button class="m-secondary" data-action="account">حسابي</button></aside>
    <main id="main" class="m-content">
      <section data-screen="home">
        <div class="m-reference-home">
          <h1 class="m-visually-hidden">الخيميائي — اختار المرحلة</h1>
          <div class="m-home-brand"><img class="m-home-logo" src="assets/logo.png" alt="الخيميائي في العلوم — أ. مينا جرجس"><div class="m-grade-picker" role="group" aria-label="اختيار الصف الدراسي"><button data-grade="1" aria-label="الصف الأول الإعدادي" aria-pressed="true"><img src="assets/1_active.png" alt="1"></button><button data-grade="2" aria-label="الصف الثاني الإعدادي" aria-pressed="false"><img src="assets/2.png" alt="2"></button><button data-grade="3" aria-label="الصف الثالث الإعدادي" aria-pressed="false"><img src="assets/3.png" alt="3"></button></div></div>
          <div class="m-stage-images" aria-label="المراحل التعليمية">
            <button class="m-stage-image" data-unit="0" aria-label="المرحلة الأولى — المادة"><img src="assets/mobile/card_1.png" alt="المرحلة الأولى"></button>
            <button class="m-stage-image" data-unit="1" aria-label="المرحلة الثانية — مجالات القوى"><img src="assets/mobile/card_2.png" alt="المرحلة الثانية"></button>
            <button class="m-stage-image" data-unit="2" aria-label="المرحلة الثالثة — الكائنات الحية"><img src="assets/mobile/card_3.png" alt="المرحلة الثالثة"></button>
            <button class="m-stage-image" data-unit="3" aria-label="المرحلة الرابعة — نظام الأرض والشمس والقمر"><img src="assets/mobile/card_4.png" alt="المرحلة الرابعة"></button>
          </div>
          <button id="home-account" class="m-home-account" aria-label="حساب الطالب" aria-haspopup="dialog">أ</button>
          <img class="m-home-character" src="assets/mobile/mr_mena.png" alt="مستر مينا يرحب بك">
        </div>
      </section>
      <section data-screen="courses" hidden><h1>دروسي</h1><div id="courses-content"></div></section>
      <section data-screen="lesson" hidden><div id="lesson-content"></div></section>
      <section data-screen="lab" hidden><div id="lab-content"></div></section>
      <section data-screen="quiz" hidden><div id="quiz-content"></div></section>
      <section data-screen="progress" hidden><div id="progress-content"></div></section>
    </main>
  </div>
  <footer class="m-dock">
    <div class="m-player" id="player" hidden><button id="audio-toggle" class="m-icon-btn" aria-label="إيقاف الصوت مؤقتاً">Ⅱ</button><div class="m-player-copy"><strong id="audio-title">شرح مستر مينا</strong><span id="audio-status" class="m-small" role="status">جاهز للاستماع</span></div><div class="m-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></div><button id="audio-close" class="m-icon-btn" aria-label="إغلاق المشغّل">×</button></div>
    <div class="m-action-row"><button id="mentor" class="m-mentor" aria-haspopup="dialog"><img src="assets/mena_avatar_centered.png" alt=""><span>مساعدة</span><small class="m-help-description">اسأل مستر مينا</small></button><button id="next-action" class="m-primary">ابدأ الحصة ←</button></div>
    <nav class="m-nav" aria-label="التنقل الرئيسي"><button data-view="home" aria-current="page"><span aria-hidden="true">⌂</span>الرئيسية</button><button data-view="courses"><span aria-hidden="true">▤</span>دروسي</button><button data-view="lab"><span aria-hidden="true">⚗</span>المعمل</button><button data-view="progress"><span aria-hidden="true">☆</span>إنجازي</button></nav>
  </footer>
</div>
<dialog id="sheet" class="m-sheet" aria-labelledby="sheet-title"><div class="m-sheet-head"><h2 id="sheet-title">معاك يا بطل</h2><button id="close-sheet" class="m-icon-btn" aria-label="إغلاق">×</button></div><div id="sheet-content"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase_config.js?v=1"></script>
<script src="js/auth.js?v=qa2"></script>
<script src="js/curriculum_data.js?v=gravity-fix1"></script>
<script src="js/audio-catalog.js?v=qa2"></script>
<script src="js/app.js?v=dedicated1"></script>
<script src="js/mobile-v2.js?v=dedicated1"></script>
</body>
</html>
